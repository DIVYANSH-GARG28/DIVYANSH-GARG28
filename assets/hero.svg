<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Dark Space Backdrop -->
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="50%" stop-color="#020306"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Animated Ambient Mesh Glows -->
    <radialGradient id="meshBlue" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshViolet" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#5E5CE6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#5E5CE6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshCyan" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#64D2FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#64D2FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Frosted Glass Card Fill -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- High-Velocity Neon Laser Text Gradient -->
    <linearGradient id="laserTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#64D2FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#BF5AF2"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
      <animate attributeName="x1" values="-100%;100%" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Subtle Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Specular Light Reflection Sweep -->
    <linearGradient id="podSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .sf-bold { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif; font-weight: 800; }
    .sf-medium { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Plus Jakarta Sans", sans-serif; font-weight: 500; }
    .sf-regular { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Plus Jakarta Sans", sans-serif; font-weight: 400; }
    .sf-mono { font-family: "SF Mono", "Fira Code", "JetBrains Mono", monospace; }

    @keyframes cyberGlitch {
      0%, 90%, 100% { transform: translate(0, 0); opacity: 1; }
      92% { transform: translate(-2px, 1px); opacity: 0.9; }
      94% { transform: translate(2px, -1px); opacity: 1; }
      96% { transform: translate(-1px, 2px); opacity: 0.95; }
      98% { transform: translate(1px, -1px); opacity: 1; }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .name-glitch {
      animation: cyberGlitch 3.8s infinite;
    }
    .neon-cursor {
      animation: cursorBlink 1s infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="480" rx="28" fill="url(#appleBg)"/>
  <rect width="1200" height="480" rx="28" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Ambient Light Orbs with SMIL breathing -->
  <circle cx="220" cy="140" r="320" fill="url(#meshBlue)">
    <animate attributeName="r" values="300;340;300" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="180" r="340" fill="url(#meshViolet)">
    <animate attributeName="r" values="320;360;320" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="420" r="280" fill="url(#meshCyan)"/>

  <!-- Subtle Apple Grid Lines -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="900" y1="0" x2="900" y2="480"/>
    <line x1="1100" y1="0" x2="1100" y2="480"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
  </g>

  <!-- TOP STATUS CAPSULE -->
  <g transform="translate(415, 42)">
    <rect width="370" height="34" rx="17" fill="url(#glassCard)" stroke="url(#borderGrad)" stroke-width="1"/>
    <circle cx="22" cy="17" r="4.5" fill="#30D158">
      <animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="17" r="8" fill="none" stroke="#30D158" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="6;14;6" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="22" fill="#E5E5EA" class="sf-mono" font-size="11.5" letter-spacing="1">SYSTEM ONLINE &#8226; AKTU CSE 8.16 CGPA</text>
  </g>

  <!-- MAIN HEADLINE WITH CYBER GLITCH ANIMATION -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <g class="name-glitch">
      <text y="0" fill="#00D9FF" opacity="0.4" class="sf-bold" font-size="52" letter-spacing="-1" dx="-2" dy="1">&lt; DIVYANSH GARG /&gt;</text>
      <text y="0" fill="#BF5AF2" opacity="0.4" class="sf-bold" font-size="52" letter-spacing="-1" dx="2" dy="-1">&lt; DIVYANSH GARG /&gt;</text>
      <text y="0" fill="url(#laserTextGrad)" class="sf-bold" font-size="52" letter-spacing="-1" filter="url(#neonGlow)">&lt; DIVYANSH GARG /&gt;</text>
    </g>

    <rect x="290" y="-38" width="6" height="46" rx="3" fill="#64D2FF" class="neon-cursor"/>

    <text y="46" fill="#A1A1A6" class="sf-medium" font-size="21" letter-spacing="-0.3">Engineering Intelligence. At System Scale.</text>
    <text y="78" fill="#636366" class="sf-regular" font-size="14.5" letter-spacing="0.2">Workflow Automation &#8226; RAG &amp; Vector AI &#8226; Core Engineering</text>
  </g>

  <!-- 3 CUPERTINO MINI PILL PODS (100% HONEST VERIFIED ENGINEERING DOMAINS) -->
  <!-- POD 1: x = 180 (Workflow Automation) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4s" repeatCount="indefinite"/>
    <rect x="180" y="290" width="260" height="110" rx="20" fill="url(#glassCard)" stroke="url(#borderGrad)" stroke-width="1"/>
    <rect x="180" y="290" width="260" height="110" rx="20" fill="url(#podSweep)"/>
    <circle cx="216" cy="326" r="14" fill="#30D158" fill-opacity="0.25"/>
    <path d="M210 326L214 330L222 322" stroke="#30D158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="240" y="324" fill="#FFFFFF" class="sf-bold" font-size="14">Workflow Automation</text>
    <text x="240" y="340" fill="#8E8E93" class="sf-regular" font-size="11">n8n &#8226; Webhooks &#8226; Zoho Bigin</text>
    <text x="204" y="378" fill="#30D158" class="sf-mono" font-size="11">15+ Ingestion Pipelines</text>
  </g>

  <!-- POD 2: x = 470 (RAG & Vector AI) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4s" begin="1.3s" repeatCount="indefinite"/>
    <rect x="470" y="290" width="260" height="110" rx="20" fill="url(#glassCard)" stroke="url(#borderGrad)" stroke-width="1"/>
    <rect x="470" y="290" width="260" height="110" rx="20" fill="url(#podSweep)"/>
    <circle cx="506" cy="326" r="14" fill="#BF5AF2" fill-opacity="0.25"/>
    <circle cx="506" cy="326" r="6" stroke="#BF5AF2" stroke-width="2" fill="none"/>
    <path d="M506 318V322M506 330V334M498 326H502M510 326H514" stroke="#BF5AF2" stroke-width="2" stroke-linecap="round"/>
    <text x="530" y="324" fill="#FFFFFF" class="sf-bold" font-size="14">RAG &amp; Vector AI</text>
    <text x="530" y="340" fill="#8E8E93" class="sf-regular" font-size="11">ChromaDB &#8226; FAISS &#8226; LLMs</text>
    <text x="494" y="378" fill="#BF5AF2" class="sf-mono" font-size="11">Context-Grounded Systems</text>
  </g>

  <!-- POD 3: x = 760 (Core Engineering & DSA) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4s" begin="2.6s" repeatCount="indefinite"/>
    <rect x="760" y="290" width="260" height="110" rx="20" fill="url(#glassCard)" stroke="url(#borderGrad)" stroke-width="1"/>
    <rect x="760" y="290" width="260" height="110" rx="20" fill="url(#podSweep)"/>
    <circle cx="796" cy="326" r="14" fill="#0071E3" fill-opacity="0.25"/>
    <path d="M790 326L802 326M796 320L796 332" stroke="#64D2FF" stroke-width="2" stroke-linecap="round"/>
    <text x="820" y="324" fill="#FFFFFF" class="sf-bold" font-size="14">Core Engineering</text>
    <text x="820" y="340" fill="#8E8E93" class="sf-regular" font-size="11">Python &#8226; C++ &#8226; LeetCode 200+</text>
    <text x="784" y="378" fill="#64D2FF" class="sf-mono" font-size="11">Algorithmic Problem Solving</text>
  </g>

  <!-- BOTTOM ACCENT LINE WITH GLOW -->
  <line x1="200" y1="440" x2="1000" y2="440" stroke="url(#borderGrad)" stroke-width="1"/>
</svg>